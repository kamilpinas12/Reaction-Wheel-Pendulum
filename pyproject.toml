[tool.pytest.ini_options]
testpaths = ["RL/tests"]
pythonpath = ["RL/src"]

# Logowanie
log_file = "RL/logs/pytest_runs.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "INFO"

addopts = "-v -s"

python_files = ["test_*.py", "*_test.py"]