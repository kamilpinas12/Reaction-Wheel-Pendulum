base_agent:
  learning_rate: 1e-3
  learning_rate_scheduling_end: 4e-5
  gamma: 0.999
  seed: 42
  device: "cuda"
  total_timesteps: 3000000
  output_dir: "./RL/logs/ppo_train/"
  writer_enable: true
  eval:
    record: false
    plot: true
    num_episodes: 6
    num_models: 1
    interval: 500000
    render: false
    deterministic: true

ppo_agent:
  value_coef: 0.3
  entropy_coef: 0.01
  gae_lambda: 0.95
  max_grad_norm: 0.5
  n_rollout_steps: 2048
  n_epochs: 5
  batch_size: 512
  clip_range: 0.2
  hid_size: 64
  repeat_num: 2
  activation: "relu"

env:
  seed: 42
  num_envs: 16
  dt: 0.01
  max_episode_steps: 1000
  terminate_pend_vel: 10
  terminate_wheel_vel: 450
  K_pend_vel: 0.1165
  K_sin: -3.915
  K_reac_wheel: -0.00786
  initial_state_range: [3.14, 3.0, 0.0]

reward:
  type: "balanced"
  params:
     upright_weight: 0.3
     stability_weight: 0.5
     spin_weight: 0.1
     energy_weight: 0.01
     wheel_vel_weight: 0.01
