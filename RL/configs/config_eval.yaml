base_agent:
  learning_rate: 1e-4
  gamma: 0.995
  device: "cuda"
  total_timesteps: 0
  output_dir: "./RL/logs/ppo_eval/"
  writer_enable: false
  eval:
    record: false
    plot: true
    num_episodes: 6
    num_models: 1
    render: false
    deterministic: true

ppo_agent:
  hid_size: 64
  repeat_num: 2
  activation: "relu"

env:
  seed: null
  num_envs: 16
  dt: 0.01
  max_episode_steps: 4000
  K_pend_vel: 0.1165
  K_sin: -3.915
  K_reac_wheel: -0.00786
  initial_state_range: [3.14, 4.0, 0.0]
