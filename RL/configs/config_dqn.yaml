base_agent:
  learning_rate: 3e-4
  gamma: 0.99
  seed: 42
  device: "cuda"
  output_dir: "./RL/logs/dqn_train"

dqn_agent:
  buffer_size: 100000        
  learning_starts: 20000       
  
  batch_size: 128               
  train_freq: 1                
  target_update_interval: 5000  
  tau: 0.1                     
  
  exploration_fraction: 0.8
  exploration_initial_eps: 1.0 
  exploration_final_eps: 0.1  
  
  policy: "MlpPolicy"      

training:
  total_timesteps: 300000
  
  num_eval_episodes: 10

  deterministic_eval: true

  save_interval: 50000

  output_dir: "./RL/logs/dqn_train"

env:
  num_envs: 1
  dt: 0.02
  max_episode_steps: 1000 # 8s
  K_pend_vel: 0.085634
  K_sin: -9.101332
  K_reac_wheel: -0.009168