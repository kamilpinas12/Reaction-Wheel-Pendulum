base_agent:
  learning_rate: 0.0003         
  gamma: 0.999                  # Keep this high so it can chain momentum rocks together
  seed: 42
  device: "cuda"
  total_timesteps: 1000000      # 2M is plenty if the reward isn't actively fighting the agent
  output_dir: "./RL/logs/td3_train/"
  writer_enable: true
  eval:
    record: false
    plot: true
    num_episodes: 5             
    num_models: 4
    interval: 50000            # Evaluate more often to see exactly when it breaks out
    render: false
    deterministic: true

td3_agent:
  policy: "MlpPolicy"
  net_arch: [256, 256]
  activation: "relu"
  repeat_num: 4                 
  action_noise_std: 0.3         
  action_noise_initial_std: 0.7 # Even higher initial blast to physically kick it out of the bottom
  action_noise_final_std: 0.02  
  action_noise_decay_timesteps: 900000 # Keep exploration high for 75% of the run
  actor_lr: 0.0003              
  critic_lr: 0.001              
  buffer_size: 2000000          # Matched to total_timesteps to avoid the FIFO deletion trap!
  learning_starts: 32000        # 2,000 steps per env of pure random thrashing before brain turns on
  batch_size: 256               
  train_freq: 1                 
  gradient_steps: 1             
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5

env:
  seed: 42
  num_envs: 16
  dt: 0.01
  max_episode_steps: 2000        # 6 seconds per episode. Long enough to swing up, short enough to keep buffer clean
  terminate_pend_vel: 40        # Loosened so fast momentum rocks don't trigger accidental termination
  terminate_wheel_vel: 400       # Raised significantly so it can use maximum wheel speed to build momentum
  K_pend_vel: 0.1165
  K_sin: -3.915
  K_reac_wheel: -0.00786
  initial_state_range: [3.14, 3.0, 0.0]

reward:
  type: "balanced"
  params:
     upright_weight: 0.8        # Heavily prioritize getting to the top
     stability_weight: 0.15     # Lowered for now; we don't care about shaking yet, we just want it to get UP
     spin_weight: 0.05          
     energy_weight: 0.001       # NEARLY ZERO: Stop punishing the agent for using the motor!
     wheel_vel_weight: 0.001    # NEARLY ZERO: Allow the wheel to spin fast to accumulate momentum
     